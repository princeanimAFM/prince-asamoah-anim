# Netlify settings for RMR Hub. In Netlify, set the base directory to "rmr-hub".
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Runs the app's server on Netlify (pages, sign-in, signing links, API routes).
[[plugins]]
  package = "@netlify/plugin-nextjs"
