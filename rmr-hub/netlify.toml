# Netlify settings for RMR Hub. In Netlify, set the base directory to "rmr-hub".
[build]
  # Migrate the database first, so the live app can skip that check when it starts.
  command = "npm run db:migrate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  MIGRATIONS_AT_BUILD = "true"

[functions]
  directory = "netlify/functions"

# Runs the app's server on Netlify (pages, sign-in, signing links, API routes).
[[plugins]]
  package = "@netlify/plugin-nextjs"
