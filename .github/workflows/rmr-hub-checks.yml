# Runs RMR Hub's tests, type check and build on every pull request and push to main.
name: RMR Hub checks

on:
  pull_request:
    paths: ["rmr-hub/**", ".github/workflows/rmr-hub-checks.yml"]
  push:
    branches: [main]
    paths: ["rmr-hub/**", ".github/workflows/rmr-hub-checks.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmr-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rmr-hub/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npx next build
