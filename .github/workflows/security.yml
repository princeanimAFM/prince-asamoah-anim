# Safety checks for every project in this repo, on every pull request, every push to main,
# and weekly (new vulnerabilities are published all the time, even when the code doesn't change).
#   - Secrets: gitleaks scans the whole git history for committed keys and passwords.
#   - Code: GitHub CodeQL looks for security bugs (injection, XSS, unsafe redirects, …).
#   - Dependencies: known vulnerabilities and licences in every npm project (on a pull
#     request this includes any dependencies it adds, before they are merged).
name: Security and compliance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No .env files committed
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error title=Environment file committed::$found. Keys belong in .env.local or the host's secret settings. Remove the file and rotate any keys in it."
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerabilities and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: .github/scripts/check-dependencies.sh

  codeql:
    name: Code scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
